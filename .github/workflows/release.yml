name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg sidecars
        shell: pwsh
        run: ./.github/scripts/install-ffmpeg-sidecars.ps1

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npm run tauri build -- --bundles nsis,msi --ci

      - name: Prepare release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $assetDirectory = "release-assets"
          $portableDirectory = Join-Path $env:RUNNER_TEMP "tesla-usb-manager-portable"
          $portableAppDirectory = Join-Path $portableDirectory "Tesla USB Manager"
          New-Item -ItemType Directory -Force $assetDirectory | Out-Null
          New-Item -ItemType Directory -Force $portableAppDirectory | Out-Null

          $bundles = Get-ChildItem "src-tauri/target/release/bundle" `
            -Recurse `
            -Include "*.exe", "*.msi"

          if (-not $bundles) {
            throw "No Windows installer assets were produced."
          }

          foreach ($bundle in $bundles) {
            Copy-Item -Path $bundle.FullName -Destination $assetDirectory
          }

          $portableFiles = @(
            "src-tauri/target/release/tesla-usb-manager.exe",
            "src-tauri/target/release/ffmpeg.exe",
            "src-tauri/target/release/ffprobe.exe"
          )

          foreach ($portableFile in $portableFiles) {
            if (-not (Test-Path $portableFile)) {
              throw "Portable release file was not produced: $portableFile"
            }
            Copy-Item -Path $portableFile -Destination $portableAppDirectory
          }

          $portableReadme = @'
          Tesla USB Manager Portable

          Files included:
          - tesla-usb-manager.exe
          - ffmpeg.exe
          - ffprobe.exe

          Requirements:
          - Microsoft Edge WebView2 Runtime must already be installed on Windows.

          Usage:
          1. Extract this ZIP to a normal folder.
          2. Keep all included files in the same folder.
          3. Run tesla-usb-manager.exe.
          '@
          Set-Content -Path (Join-Path $portableAppDirectory "README.txt") -Value $portableReadme

          $portableZipName = "Tesla-USB-Manager-${env:GITHUB_REF_NAME}-windows-portable.zip"
          $portableZipPath = Join-Path $assetDirectory $portableZipName
          if (Test-Path $portableZipPath) {
            Remove-Item $portableZipPath -Force
          }
          Compress-Archive `
            -Path (Join-Path $portableDirectory "*") `
            -DestinationPath $portableZipPath `
            -CompressionLevel Optimal

          Get-ChildItem $assetDirectory -File | ForEach-Object {
            $hash = Get-FileHash $_.FullName -Algorithm SHA256
            $line = "$($hash.Hash.ToLower())  $($_.Name)"
            Set-Content -Path "$($_.FullName).sha256" -Value $line
          }

      - name: Write release page
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $notes = @'
          # Tesla USB Manager {{VERSION}}

          ## Download

          Most users should download the `.exe` setup file. The `.msi` package is
          included for managed Windows deployment, and the portable `.zip` is
          included for users who prefer to extract and run the app manually.

          ## What is included

          - Tesla USB Manager desktop app.
          - Windows app runtime bundled by Tauri.
          - FFmpeg and FFprobe sidecars for audio conversion.
          - Portable ZIP with the app executable and sidecars.
          - SHA-256 checksum files for every installer asset.

          You do not need Node.js, Rust, the Tauri CLI, or separate FFmpeg
          executables when using the installer or portable ZIP from this release.

          ## Install

          1. Download the `.exe` installer from Assets.
          2. Run the installer and follow the Windows prompts.
          3. Launch Tesla USB Manager from the Start menu.
          4. Insert a USB drive and complete Step 1 before using Marketplace.

          ## Portable ZIP

          1. Download the `windows-portable.zip` asset from Assets.
          2. Extract it to a normal folder.
          3. Keep `tesla-usb-manager.exe`, `ffmpeg.exe`, and `ffprobe.exe` in the
             same folder.
          4. Run `tesla-usb-manager.exe`.

          The portable ZIP does not install WebView2 for you. If the app does not
          launch, install the Microsoft Edge WebView2 Runtime and try again.

          ## Verify

          Download the matching `.sha256` file and compare it with one of:

          ```powershell
          Get-FileHash ".\Tesla USB Manager*.exe" -Algorithm SHA256
          Get-FileHash ".\Tesla-USB-Manager-*-windows-portable.zip" -Algorithm SHA256
          ```

          Windows SmartScreen may warn on unsigned community builds. Confirm
          that the file came from this repository's release assets before
          installing.
          '@

          $notes = $notes -replace "(?m)^          ", ""
          $notes = $notes -replace "{{VERSION}}", $env:GITHUB_REF_NAME
          Set-Content -Path "release-assets/release-notes.md" -Value $notes

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-assets/release-notes.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/*.zip
            release-assets/*.sha256
          name: Tesla USB Manager ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
